<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <script>
      var p = location.pathname
      sessionStorage.redirect = p + location.search + location.hash
      location.replace(
        location.origin +
          location.pathname.split('/').slice(0, 2).join('/') +
          '/',
      )
    </script>
  </head>
  <body></body>
</html>
